# Zigbee2MQTT configuration for the Wortkarten Pi.
# Copy to /opt/zigbee2mqtt/data/configuration.yaml before the first start.
# On first start zigbee2mqtt replaces the GENERATE values with real network keys:
# never commit that live file.
version: 5

homeassistant:
    enabled: false

# Web interface on http://<pi>:8080 (pairing, renaming devices). No password: home network only.
frontend:
    enabled: true

mqtt:
    base_topic: zigbee2mqtt
    server: "mqtt://localhost"

# "ZigBee 3.0 USB-Dongle Plus-E" (Silicon Labs EFR32MG21 behind a CH340 USB-serial chip).
# Find your port with: ls /dev/serial/by-id/
# Adapter: "ember" for Silicon Labs (EFR32, "-E" dongles), "zstack" for TI (CC2652, "-P" dongles).
serial:
    port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    adapter: ember
    baudrate: 115200
    rtscts: false

advanced:
    log_level: info
    network_key: GENERATE
    pan_id: GENERATE
    ext_pan_id: GENERATE
